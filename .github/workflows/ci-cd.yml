name: CI/CD ClickClak Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist

  test:
    name: Pruebas automatizadas
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    name: Imagen Docker
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clickclak-backend:${{ github.sha }} ./backend
      - run: docker save clickclak-backend:${{ github.sha }} -o clickclak-backend.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: clickclak-backend.tar

  deploy:
    name: Despliegue simulado (staging)
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i clickclak-backend.tar
      - run: chmod +x scripts/deploy-simulado.sh
      - run: ./scripts/deploy-simulado.sh clickclak-backend:${{ github.sha }}
